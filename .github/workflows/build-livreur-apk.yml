name: Build Livreur APK 🦅

on:
  push:
    branches: [ "main", "master", "feature/client-header-trend1" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Forge Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: ☕ Setup Java 21 (Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: ⚙️ Install Dependencies
        run: pnpm install

      - name: 🏗️ Web Build (Vite) & Telemetry
        working-directory: apps/livreur
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" > .env.production
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env.production
          pnpm run build
          if grep -q "supabase" dist/assets/*.js; then echo "✅ URL injected successfully"; else echo "❌ Injection failed"; exit 1; fi

      - name: 🤖 Capacitor Android Sync
        working-directory: apps/livreur
        run: |
          pnpm add @capacitor/android
          npx cap init TheEagletn com.eagletn.livreur --web-dir dist || true
          npx cap add android || true
          npx cap sync android

      - name: 📍 Inject GPS Permissions
        working-directory: apps/livreur
        run: |
          sed -i 's/<uses-permission android:name="android\.permission\.ACCESS_COARSE_LOCATION" \/>/<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" \/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/>/g' android/app/src/main/AndroidManifest.xml || true

      - name: 🔐 Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo $KEYSTORE_BASE64 | base64 --decode > apps/livreur/android/app/eagletn-livreur.keystore

      - name: 🔥 Build & Sign Release APK
        working-directory: apps/livreur/android
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=eagletn-livreur.keystore \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            --stacktrace

      - name: 📦 Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: EAGLE-Livreur-Release-APK
          path: apps/livreur/android/app/build/outputs/apk/release/app-release.apk
